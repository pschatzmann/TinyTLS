name=TinyTLS
version=0.2.0
author=Phil Schatzmann
maintainer=Phil Schatzmann
sentence=Header-only TLS 1.3 client for Arduino with certificate validation.
paragraph=TinyTLS implements the TLS 1.3 client handshake, the record layer and the cipher suites TLS_AES_128_GCM_SHA256 and TLS_CHACHA20_POLY1305_SHA256 in portable C++11 headers. Server certificates are validated against a trust store (ECDSA P-256 and RSA with SHA-256). Use the SecureClient or TinyTLS classes.
category=Communication
